name: 构建并推送镜像

on:
  push:
    branches: [main]
    paths:
      - 'imgproxy/**'
      - 'harvester/**'
      - 'imgrewrite/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: immortal-addons-imgproxy
            context: ./imgproxy
            version: "5.5"
          - image: immortal-addons-harvester
            context: ./harvester
            version: "1.0"
          - image: immortal-addons-imgrewrite
            context: ./imgrewrite
            version: "1.0"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # 云端用官方源（国内用户自己构建时 Dockerfile 默认走阿里源）
          build-args: |
            APT_MIRROR=deb.debian.org
            PIP_INDEX=https://pypi.org/simple/
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 已推送" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest\`" >> $GITHUB_STEP_SUMMARY
